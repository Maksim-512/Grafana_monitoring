# файл для указания источников (баз данных), в которые Grafana будет ходить и собирать данные, т.е в Prometheus и Grafana loki

api_version: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true # устанавливает источник данных по умолчанию
    editable: true # можно ли редактировать дашборд(если true то можно)

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
